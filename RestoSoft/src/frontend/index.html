<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoSoft - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <div class="login-container">
        <h1>RestoSoft</h1>
        <p>Ingresa tus credenciales del sistema</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="ejemplo@restosoft.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
            </div>
            
            <p id="errorMessage" class="error-text" style="display: none;">Usuario o contraseña incorrectos.</p>
            
            <button type="submit" class="btn-primary">Ingresar</button>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
