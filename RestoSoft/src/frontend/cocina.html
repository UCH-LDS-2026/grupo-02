<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoSoft - Cocina</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/cocina.css">
</head>
<body>
    <header class="top-header">
        <div class="header-left">
            <a href="salon.html" class="logo">RestoSoft</a>
            <nav class="main-nav">
                <a href="salon.html" class="nav-item">Mesas</a>
                <a href="cocina.html" class="nav-item active">Cocina</a>
                <a href="administracion.html" class="nav-item">Caja / Historial</a>
            </nav>
        </div>
        
        <div class="user-info">
            <span id="nombreUsuario"></span>
            <button id="btnLogout" class="btn-outline">Cerrar Sesión</button>
        </div>
    </header>

    <div class="kanban-container">
        
        <div class="kanban-column column-pendientes">
            <div class="column-header">
                <h2>Nuevos Pedidos</h2>
                <span class="badge badge-danger">0</span>
            </div>
            <div class="column-body" id="columnaPendientes">
                </div>
        </div>

        <div class="kanban-column column-produccion">
            <div class="column-header">
                <h2>En Preparación</h2>
                <span class="badge badge-warning">0</span>
            </div>
            <div class="column-body" id="columnaProduccion">
            </div>
        </div>

        <div class="kanban-column column-listos">
            <div class="column-header">
                <h2>Listos / Despachados</h2>
                <span class="badge badge-success">0</span>
            </div>
            <div class="column-body" id="columnaListos">
            </div>
        </div>

    </div>

    <script src="js/cocina.js"></script>
</body>
</html>
